name: Verify Systems Modeler
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - name: Frontend checks
        run: |
          for script in scripts/check_*.cjs; do node "$script"; done
      - name: Real MCP HTTP, SSE and stdio
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 13250 > /tmp/modeler.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:13250/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/check_mcp.py --stdio
